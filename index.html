<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050f1a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<title>ส่งน้ำดื่ม Plant 3</title>
<style>
:root{--bg:#050f1a;--card:#0b1f33;--tx:#e6f4ff;--mu:#7fa3bf;--bd:#1b4260;--pri:#2fe0ff;--ok:#34f0a8;--wa:#ffb547;--er:#ff5d7a;--vi:#b794ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:17px/1.45 "Noto Sans Thai","Sarabun",system-ui,sans-serif;background:radial-gradient(900px 420px at 50% -120px,#0e3a5c 0,transparent 70%),linear-gradient(rgba(47,224,255,.045) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(47,224,255,.045) 1px,transparent 1px) 0 0/44px 44px,var(--bg);background-attachment:fixed}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:12px 14px 10px;background:rgba(5,15,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
h1{font:600 20px/1.2 Kanit,"Noto Sans Thai",sans-serif;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.bar{height:14px;border-radius:7px;background:#0a2438;border:1px solid var(--bd);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1fb8ff,var(--ok));box-shadow:0 0 14px var(--ok);transition:width .4s}
.sub{font-size:14px;color:var(--mu);margin-top:7px}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs button{flex:0 0 auto;min-width:84px;min-height:52px;line-height:1.2;white-space:nowrap;padding:0 14px;border:1px solid var(--bd);background:#0a2236;color:var(--tx);border-radius:12px;font:500 15px Kanit,"Noto Sans Thai",sans-serif}
.tabs button.on{background:var(--pri);color:#02202a;border-color:var(--pri);box-shadow:0 0 16px rgba(47,224,255,.5)}
main{padding:14px 14px 130px;max-width:640px;margin:auto}
.c{background:linear-gradient(160deg,#0f2d47,#0a1d31);border:1px solid var(--bd);border-left:7px solid var(--er);border-radius:6px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%);padding:14px 16px 14px 14px;margin-bottom:14px}
.c.signed{border-left-color:var(--ok)}.c.left{border-left-color:var(--wa)}.c.fail{border-left-color:var(--vi)}.c.h{border-left-color:var(--pri)}
.c .t{display:flex;justify-content:space-between;align-items:center;gap:10px;font:600 19px/1.3 Kanit,"Noto Sans Thai",sans-serif}
.c .m{font-size:14px;color:var(--mu);margin-top:5px}
.q{font:600 16px Kanit,sans-serif;color:var(--pri);border:1px solid var(--pri);border-radius:8px;padding:2px 10px;white-space:nowrap;background:rgba(47,224,255,.08)}
button{font:inherit;cursor:pointer}
.row{display:flex;gap:10px;margin-top:12px}
.row button{flex:1;min-height:60px;padding:10px 4px;border:0;border-radius:14px;font:600 16px/1.2 Kanit,"Noto Sans Thai",sans-serif}
.row button:active{transform:scale(.97)}
.b1{background:var(--ok);color:#03251a}.b2{background:var(--wa);color:#2b1b00}.b3{background:var(--vi);color:#1c1040}.b0{background:var(--pri);color:#02202a}
.gh{background:transparent!important;color:var(--pri)!important;border:1px solid var(--bd)!important}
.sm{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--bd);background:#0a2236;color:var(--pri);font:500 15px Kanit,sans-serif}
.fin{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(5,15,26,.94);backdrop-filter:blur(10px);border-top:1px solid var(--bd)}
.fin button{display:block;width:100%;max-width:640px;margin:auto;min-height:62px;border:0;border-radius:16px;font:600 18px Kanit,sans-serif;background:linear-gradient(90deg,#1fd6a0,var(--ok));color:#03251a;box-shadow:0 0 22px rgba(52,240,168,.35)}
.fin button:disabled{background:#0f2a40;color:var(--mu);box-shadow:none}
.ov{position:fixed;inset:0;background:rgba(2,8,14,.72);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:linear-gradient(180deg,#0d2a43,#081a2b);border-top:2px solid var(--pri);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(47,224,255,.15)}
.sh h2{margin:0 0 12px;font:600 21px Kanit,sans-serif}
label{display:block;font-size:15px;color:var(--mu);margin:14px 0 6px}
input,select,textarea{width:100%;min-height:54px;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;font:inherit;font-size:18px;background:#061626;color:var(--tx)}
textarea{min-height:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
canvas{width:100%;height:190px;border:2px dashed var(--pri);border-radius:14px;background:#fff;touch-action:none}
img.p{max-width:100%;border-radius:12px;margin-top:8px}
.warn{background:rgba(255,181,71,.12);color:#ffd28a;border:1px solid rgba(255,181,71,.35);padding:10px 12px;border-radius:10px;font-size:15px;margin-top:10px}
.er{color:var(--er);font-size:15px;margin-top:8px;min-height:20px}
.empty{text-align:center;color:var(--mu);padding:44px 0;font-size:18px}
#bn div{padding:12px 16px;font:600 16px Kanit,sans-serif;color:#1a0a00}
.bn1{background:var(--wa)}.bn2{background:var(--er);color:#fff!important;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{box-shadow:inset 0 0 24px rgba(255,255,255,.35)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pl{display:flex;align-items:center;gap:8px;margin:6px 0}.pl span{flex:1}.pl input{width:84px;text-align:center}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.k{background:linear-gradient(160deg,#0f2d47,#0a1d31);border:1px solid var(--bd);border-radius:6px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%);padding:14px}
.k b{display:block;font:600 34px/1.1 Kanit,sans-serif;text-shadow:0 0 18px rgba(47,224,255,.4)}
.k span{font-size:14px;color:var(--mu)}
.bq{fill:var(--pri)}.bw{fill:var(--wa)}.bl{fill:var(--ok)}.tx{font-size:9px;fill:var(--mu)}
.stk{display:flex;height:22px;border-radius:11px;overflow:hidden;background:#0a2236;margin:10px 0 8px}
.hb{height:10px;border-radius:5px;background:linear-gradient(90deg,#1fb8ff,var(--pri));margin:3px 0 8px}
</style></head><body>
<header>
<h1><span>💧 ส่งน้ำดื่ม Plant 3</span><span><input type="date" id="dt" style="width:auto;min-height:44px;padding:6px 10px;font-size:15px" onchange="chd(this.value)"> <button class="sm" id="sg" onclick="gate(setUI)">⚙</button></span></h1>
<div class="bar"><i id="pg"></i></div>
<div class="sub" id="sub"></div>
<div class="tabs" id="tabs"></div>
</header>
<div id="bn"></div>
<main id="list"></main>
<div class="fin"><button id="fb" onclick="finish()"></button></div>
<div id="md"></div>

(function(){
var M={},L=[],dbp=new Promise(function(res){try{var r=indexedDB.open('waterdeliv',1);r.onupgradeneeded=function(){r.result.createObjectStore('kv')};r.onsuccess=function(){var d=r.result,tx=d.transaction('kv'),c=tx.objectStore('kv').openCursor();c.onsuccess=function(){var k=c.result;if(k){M[k.key]=k.value;k.continue()}};tx.oncomplete=function(){Object.keys(M).forEach(function(k){if(k.indexOf('tst/')==0){delete M[k];d.transaction('kv','readwrite').objectStore('kv').delete(k)}});if(window.SEED&&M['config/points']===undefined){M['config/points']={list:SEED.points};for(var k in SEED.imgs)M['pointimgs/'+k]={img:SEED.imgs[k]};var st=d.transaction('kv','readwrite').objectStore('kv');for(var q in M)st.put(M[q],q)}res(d)}};r.onerror=function(){res(null)}}catch(e){res(null)}});

var TESTPFX='tst/';function P(p){return window.TEST&&p.indexOf('days')==0?TESTPFX+p:p}
function put(p,v){dbp.then(function(d){if(!d)return;var s=d.transaction('kv','readwrite').objectStore('kv');v===undefined?s.delete(p):s.put(v,p)})}
function snap(p){var v=M[p];return{id:p.split('/').pop(),exists:v!==undefined,data:function(){return v}}}
function kids(p){var n=p.split('/').length+1;return Object.keys(M).filter(function(k){return k.indexOf(p+'/')==0&&k.split('/').length==n})}
function qs(p,q){var d=kids(p).map(snap);if(q.o)d.sort(function(a,b){var x=a.data()[q.o],y=b.data()[q.o];return(x<y?-1:x>y?1:0)*(q.dir=='desc'?-1:1)});if(q.n)d=d.slice(0,q.n);return{docs:d,size:d.length}}
function fire(){L.slice().forEach(function(l){l.f()})}
function sub(f){var l={f:f};L.push(l);setTimeout(f,0);return function(){L=L.filter(function(x){return x!==l})}}
function col(p,q){return{orderBy:function(f,d){return col(p,{o:f,dir:d,n:q.n})},limit:function(n){return col(p,{o:q.o,dir:q.dir,n:n})},onSnapshot:function(cb){return sub(function(){cb(qs(P(p),q))})}}}
function dl(name,data,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500);return Promise.resolve()}

 if(n=='db')return{doc:function(p){return{onSnapshot:function(cb){return sub(function(){cb(snap(P(p)))})},set:function(v){var q=P(p);M[q]=JSON.parse(JSON.stringify(v));put(q,M[q]);fire();return Promise.resolve()},delete:function(){var q=P(p);delete M[q];put(q);fire();return Promise.resolve()}}},collection:function(p){return col(p,{})}};
 if(n=='user')return{can:function(){return true},canEdit:function(){return true}};
 if(n=='downloads')return{save:function(o){return dl(o.filename,o.data,'text/csv;charset=utf-8')}}}};
window.seedPlant3=function(){ask('โหลดรายการ 25 จุด + รูป ของ Plant 3 จะแทนที่รายการจุดและรูปจุดเดิม (บันทึกการส่งรายวันไม่หาย) ดำเนินการต่อ?',function(){M['config/points']={list:SEED.points};put('config/points',M['config/points']);Object.keys(M).filter(function(k){return k.indexOf('pointimgs/')==0}).forEach(function(k){delete M[k];put(k)});for(var k in SEED.imgs){M['pointimgs/'+k]={img:SEED.imgs[k]};put('pointimgs/'+k,M['pointimgs/'+k])}fire();tell('โหลดรายการจุด Plant 3 แล้ว')})};
window.bkp=function(){var o={};for(var k in M)if(k.indexOf('tst/')!=0)o[k]=M[k];dl('water-backup-'+new Date().toLocaleDateString('sv')+'.json',JSON.stringify(o),'application/json')};
window.bulk=function(o){for(var k in o){var q=P(k);M[q]=o[k];put(q,o[k])}fire()};
window.testMode=function(){if(window.TEST){ask('ปิดโหมดทดสอบ และลบข้อมูลที่กรอกตอนทดสอบทั้งหมด?',function(){Object.keys(M).forEach(function(k){if(k.indexOf('tst/')==0){delete M[k];put(k)}});window.TEST=false;fire();tell('ปิดโหมดทดสอบและล้างข้อมูลทดสอบแล้ว')})}else{window.TEST=true;fire();tell('เปิดโหมดทดสอบแล้ว: เลือกวันที่ใดก็ได้เพื่อกรอก ข้อมูลจะไม่ปนกับข้อมูลจริง')}};
window.rst=function(){var i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=function(){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);ask('กู้คืนจะเขียนทับข้อมูลที่ชื่อเหมือนกัน ดำเนินการต่อ?',function(){for(var k in o){M[k]=o[k];put(k,o[k])}fire();tell('กู้คืนแล้ว')})}catch(e){tell('ไฟล์ไม่ถูกต้อง')}};r.readAsText(i.files[0])};i.click()};
})();
</script>
<script>
var $=function(s){return document.querySelector(s)};
var DL='15:00',WN='14:30';
var db=null,user=null,day=td(),pts=[],dd={},stops={},hist=[],tab='p',cur=null,tmp={},un=[],canW=true,canA=true,warned='',ready=false,imgs={},rp={},sec={},admUntil=0,rt={};
var ST={signed:'เซ็นรับแล้ว',left:'ไม่มีผู้เซ็น (วางไว้)',fail:'ส่งไม่ได้'};
function td(){return new Date().toLocaleDateString('sv')}
function hm(){return new Date().toTimeString().slice(0,5)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function Q(){return dd.q||{}}
var DAYS=[2,4,6];function ISD(d){return !!window.TEST||DAYS.indexOf(new Date(d+'T00:00:00').getDay())>=0}
function todo(){var L=(ISD(day)||Object.keys(stops).length)?pts:[];if(rt.ids&&rt.ids.length)L=L.filter(function(p){return rt.ids.indexOf(p.id)>=0});return L}
function stt(p){return stops[p.id]?stops[p.id].s:'p'}
function cnt(){var c={p:0,signed:0,left:0,fail:0,pq:0,dq:0};todo().forEach(function(p){var s=stt(p);c[s]++;c.pq+=Q()[p.id]||0;if(s=='signed'||s=='left')c.dq+=stops[p.id].q});return c}
function isT(){return day==td()||!!window.TEST}
async function start(){
 $('#dt').value=day;render();
 try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
 if(!db){$('#list').innerHTML='<div class="empty">เปิดระบบไม่ได้ กรุณาเปิดผ่านลิงก์ claude.ai และเข้าสู่ระบบก่อน</div>';return}
 if(user){canW=user.can('data.write')!==false;canA=user.canEdit()}
 $('#sg').style.display=canA?'':'none';if(!canW)tab='d';
 db.doc('config/points').onSnapshot(function(s){pts=s.exists?(s.data().list||[]):[];ready=true;render()});
 db.doc('config/report').onSnapshot(function(x){rp=x.exists?x.data():{}});
 db.doc('config/route').onSnapshot(function(x){rt=x.exists?x.data():{};render()});
 db.doc('config/sec').onSnapshot(function(x){sec=x.exists?x.data():{};render()});
 db.collection('pointimgs').onSnapshot(function(s){imgs={};s.docs.forEach(function(x){imgs[x.id]=x.data().img});render()});
 db.collection('days').orderBy('d','desc').limit(400).onSnapshot(function(s){hist=s.docs.map(function(x){return x.data()});render()});
 sub();setInterval(chk,30000)}
function sub(){un.forEach(function(f){f()});un=[];dd={};stops={};
 un.push(db.doc('days/'+day).onSnapshot(function(s){dd=s.exists?s.data():{};render()}));
 un.push(db.collection('days/'+day+'/stops').onSnapshot(function(s){stops={};s.docs.forEach(function(x){stops[x.id]=x.data()});render()}))}
function chd(v){if(!v)return;day=v;tab='p';sub();render()}
function render(){
 var c=cnt(),n=todo().length,d=n-c.p;
 $('#pg').style.width=(n?d/n*100:0)+'%';
 $('#sub').textContent=(window.TEST?'🧪 โหมดทดสอบ · ':'')+(rt.code?'สาย '+rt.code+(rt.name?' ('+rt.name+')':'')+' · ':'')+(day==td()?'วันนี้ ':(isT()?'วันที่ ':'ดูอย่างเดียว · กรอกได้เฉพาะวันนี้ · '))+day+' · ดำเนินการแล้ว '+d+'/'+n+' จุด (ส่งสำเร็จ '+(c.signed+c.left)+(c.fail?' · ส่งไม่ได้ '+c.fail:'')+') · เหลือ '+c.p+' จุด · ส่งน้ำรวม '+c.dq+' ถัง'+(dd.closedAt?' · ปิดรอบ '+dd.closedAt:'');
 var T=[['p','รอส่ง '+c.p],['signed','ส่งแล้ว<br>(เซ็นรับ) '+c.signed],['left','ส่งแล้ว<br>(ไม่มีผู้รับ) '+c.left],['x','ปัญหา '+c.fail],['a','ทั้งหมด'],['d','ภาพรวม'],['h','ประวัติ']];
 $('#tabs').innerHTML=T.map(function(t){return '<button class="'+(tab==t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join('');
 var fb=$('#fb'),h='';
 if(tab=='d'){$('#list').innerHTML=dash();fb.parentNode.style.display='none';chk();return}
 if(tab=='h'){h+=monthUI();hist.forEach(function(x){if(x.d.slice(0,7)!=mon)return;var s=x.sum;h+='<div class="c h" onclick="chd(\''+x.d+'\')"><div class="t"><span>'+x.d+'</span><span>'+(s?(s.late?'⚠ ปิดช้า':'✅ ปิดแล้ว'):'❌ ไม่ปิดรอบ')+'</span></div><div class="m">'+(s?s.tot+' จุด · '+s.qty+' ถัง · เซ็น '+s.signed+' · วางไว้ '+s.left+' · ส่งไม่ได้ '+s.fail+' · ปิดเวลา '+x.closedAt:'ยังไม่มีสรุป')+'</div></div>'});
  $('#list').innerHTML=h||'<div class="empty">ยังไม่มีประวัติ</div>';fb.parentNode.style.display='none';chk();return}
 fb.parentNode.style.display=(isT()&&canW)?'':'none';
 if(!ready)h='<div class="empty">กำลังโหลด...</div>';
 else if(!pts.length)h='<div class="empty">ยังไม่มีรายการจุดส่ง กด ⚙ เพื่อเพิ่ม</div>';
 else if(!n)h='<div class="empty">'+(pts.length&&!ISD(day)?'วันนี้ไม่ใช่วันส่งน้ำ (ส่งทุกวันอังคาร พฤหัสบดี เสาร์)':'ไม่มีจุดส่ง')+'</div>';
 else todo().forEach(function(p,i){var s=stt(p),r=stops[p.id];
  if(tab=='p'&&s!='p')return;if(tab=='signed'&&s!='signed')return;if(tab=='left'&&s!='left')return;if(tab=='x'&&s!='fail')return;
  h+='<div class="c '+(s=='p'?'':s)+'"><div class="t"><span>'+esc(p.n)+'</span><span class="q">'+(r?(r.s=='fail'?'ส่งไม่ได้':'ส่ง '+r.q+' ถัง'):'ยังไม่ส่ง')+'</span></div><div class="m">มีถังเดิม '+(p.ex||0)+' ถัง</div>'+pim(p);
  if(s=='p'){if(isT()&&canW)h+='<div class="row"><button class="b1" onclick="op(\''+p.id+'\',\'signed\')">✍ เซ็นรับ</button><button class="b2" onclick="op(\''+p.id+'\',\'left\')">📷 ไม่มีคนเซ็น</button><button class="b3" onclick="op(\''+p.id+'\',\'fail\')">⚠ ส่งไม่ได้</button></div>'}
  else{h+='<div class="m">'+ST[s]+' · '+r.t+(r.nm?' · ผู้รับ: '+esc(r.nm):'')+(r.note?' · '+esc(r.note):'')+''+'</div>';
   if(r.sig)h+='<img class="p" style="max-height:70px;background:#fff" src="'+r.sig+'">';if(r.ph)h+='<img class="p" src="'+r.ph+'">';
   if(isT()&&canW&&!dd.closedAt)h+='<div class="row"><button class="gh" onclick="undo(\''+p.id+'\')">แก้ไข/ส่งใหม่</button></div>'}
  h+='</div>'});
 $('#list').innerHTML=h||'<div class="empty">'+(tab=='p'?'🎉 ส่งครบทุกจุดแล้ว':'ไม่มีรายการ')+'</div>';
 fb.disabled=!!dd.closedAt||c.p>0||!n;fb.textContent=dd.closedAt?'ปิดรอบแล้วเวลา '+dd.closedAt+' (ดูสรุป)':c.p>0?'ยังเหลือ '+c.p+' จุด – ปิดรอบไม่ได้':'✅ ปิดรอบ / ดูสรุป';
 if(dd.closedAt){fb.disabled=false}
 chk()}
function chk(){var c=cnt(),b='',t=hm();
 if(ready&&isT()&&!dd.closedAt&&c.p>0&&todo().length){var nm=todo().filter(function(p){return stt(p)=='p'}).slice(0,5).map(function(p){return p.n}).join(', ');
  if(t>=DL){b='<div class="bn2">🚨 เลย '+DL+' น. แล้ว ยังเหลือ '+c.p+' จุด: '+esc(nm)+(c.p>5?' ...':'')+'</div>';fire('2','ยังส่งไม่ครบ! เหลือ '+c.p+' จุด')}
  else if(t>=WN){b='<div class="bn1">⏰ ใกล้ถึง '+DL+' น. ยังเหลือ '+c.p+' จุด</div>';fire('1','ใกล้ '+DL+' น. เหลือ '+c.p+' จุด')}}
 $('#bn').innerHTML=b}
function fire(k,m){if(warned==day+k)return;warned=day+k;try{if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}
 try{if(window.Notification&&Notification.permission=='granted')new Notification('ส่งน้ำดื่ม',{body:m});else if(window.Notification&&Notification.permission=='default')Notification.requestPermission()}catch(e){}}
function ask(msg,fn){sheet('<h2>ยืนยัน</h2><div style="font-size:18px;line-height:1.5;margin:6px 0 10px">'+esc(msg)+'</div><div class="row"><button class="gh" onclick="close_()">ยกเลิก</button><button class="b0" id="okb">ตกลง</button></div>');$('#okb').onclick=function(){close_();fn()}}
function tell(msg){sheet('<h2>แจ้งเตือน</h2><div style="font-size:18px;line-height:1.5;margin:6px 0 10px">'+esc(msg)+'</div><div class="row"><button class="b0" onclick="close_()">ตกลง</button></div>')}
function close_(){$('#md').innerHTML=''}
function sheet(h){$('#md').innerHTML='<div class="ov" onclick="if(event.target==this)close_()"><div class="sh">'+h+'</div></div>'}
function pt(id){return pts.filter(function(p){return p.id==id})[0]}
function op(id,m){cur=id;tmp={};var p=pt(id),h='<h2>'+esc(p.n)+'</h2>'+(imgs[id]?'<img class="p" style="margin:0 0 6px;max-height:140px;object-fit:cover" src="'+imgs[id]+'">':'');
 if(m!='fail')h+='<label>จำนวนถังที่ส่งวันนี้ (1–30) · มีถังเดิม '+(p.ex||0)+' ถัง</label><input id="qq" type="number" inputmode="numeric" min="1" max="30" placeholder="กรอกจำนวนถัง" style="font-size:22px;text-align:center">';
 if(m=='signed')h+='<label>ชื่อผู้รับ</label><input id="nm" placeholder="พิมพ์ชื่อผู้รับ"><label>ลายเซ็น</label><canvas id="cv"></canvas><button class="sm" style="margin-top:6px" onclick="clr()">ล้างลายเซ็น</button>';
 if(m=='left')h+='<div class="warn">ไม่มีคนเซ็น: ต้องถ่ายรูป หรือระบุตำแหน่งที่วางน้ำ อย่างน้อย 1 อย่าง</div><label>ถ่ายรูปน้ำที่วางไว้</label><input type="file" accept="image/*" capture="environment" onchange="ph(this)"><div id="pv"></div><label>วางไว้ที่ไหน / ฝากใคร</label><input id="nt" placeholder="เช่น ฝาก รปภ. หน้าประตู">';
 if(m=='fail')h+='<label>เหตุผลที่ส่งไม่ได้</label><select id="rs"><option value="">-- เลือก --</option><option>ไม่ต้องส่งวันนี้</option><option>ปิดทำการ</option><option>เข้าไม่ได้</option><option>ลูกค้าไม่รับ</option><option>น้ำไม่พอ</option><option>อื่นๆ</option></select><label>หมายเหตุ</label><input id="nt" placeholder="รายละเอียดเพิ่มเติม">';
 h+='<div class="er" id="er"></div><div class="row"><button class="gh" onclick="close_()">ยกเลิก</button><button class="b0" id="sv" onclick="ok(\''+m+'\')">บันทึก</button></div>';
 sheet(h);if(m=='signed')pad()}
var cx,dr=false,dn=false;
function pad(){var c=$('#cv'),r=c.getBoundingClientRect();c.width=r.width;c.height=r.height;cx=c.getContext('2d');cx.lineWidth=2.2;cx.lineCap='round';cx.strokeStyle='#000';dn=false;
 function g(e){var b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]}
 c.onpointerdown=function(e){dr=true;c.setPointerCapture(e.pointerId);var p=g(e);cx.beginPath();cx.moveTo(p[0],p[1])};
 c.onpointermove=function(e){if(!dr)return;var p=g(e);cx.lineTo(p[0],p[1]);cx.stroke();dn=true};
 c.onpointerup=function(){dr=false}}
function clr(){var c=$('#cv');cx.clearRect(0,0,c.width,c.height);dn=false}
function ph(inp){var f=inp.files[0];if(!f)return;var im=new Image();im.onload=function(){var s=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tmp.ph=c.toDataURL('image/jpeg',.6);$('#pv').innerHTML='<img class="p" src="'+tmp.ph+'">'};im.src=URL.createObjectURL(f)}
async function ok(m){var r={n:pt(cur).n,ex:pt(cur).ex||0,s:m,t:hm()},e='',q=$('#qq')?parseInt($('#qq').value):0;
 if(m!='fail'){if(!(q>=1&&q<=30))e='จำนวนต้องอยู่ระหว่าง 1-30 ถัง';r.q=q}else r.q=0;
 if(!e&&m=='signed'){r.nm=$('#nm').value.trim();if(!r.nm)e='กรุณากรอกชื่อผู้รับ';else if(!dn)e='กรุณาให้ผู้รับเซ็นชื่อ';else r.sig=$('#cv').toDataURL('image/png')}
 if(!e&&m=='left'){r.note=$('#nt').value.trim();if(tmp.ph)r.ph=tmp.ph;if(!r.note&&!r.ph)e='ต้องมีรูปถ่าย หรือระบุตำแหน่งที่วางน้ำ'}
 if(!e&&m=='fail'){var rs=$('#rs').value,nt=$('#nt').value.trim();if(!rs)e='กรุณาเลือกเหตุผล';else if(rs=='อื่นๆ'&&!nt)e='กรุณาระบุหมายเหตุ';r.note=rs+(nt?' – '+nt:'')}
 if(e){$('#er').textContent=e;return}
 $('#sv').disabled=true;
 try{await db.doc('days/'+day+'/stops/'+cur).set(r);if(!dd.d)db.doc('days/'+day).set(Object.assign({},dd,{d:day})).catch(function(){});close_()}catch(x){$('#sv').disabled=false;$('#er').textContent='บันทึกไม่สำเร็จ ('+(x&&x.code||'error')+') ลองใหม่อีกครั้ง'}}
function undo(id){ask('ยกเลิกสถานะของจุดนี้ แล้วให้กลับไปรอส่ง?',async function(){try{await db.doc('days/'+day+'/stops/'+id).delete()}catch(x){tell('ทำรายการไม่สำเร็จ')}})}
function sumo(){var c=cnt(),L=['สรุปส่งน้ำดื่ม วันที่ '+day,'ทั้งหมด '+todo().length+' จุด · ส่งน้ำรวม '+c.dq+' ถัง','✅ เซ็นรับ '+c.signed+' จุด','📦 วางไว้/ไม่มีผู้เซ็น '+c.left+' จุด','⚠ ส่งไม่ได้ '+c.fail+' จุด'];
 todo().forEach(function(p){var r=stops[p.id];if(r&&r.s=='left')L.push('- วางไว้ '+p.n+' ('+r.q+' ถัง): '+(r.note||'มีรูปถ่าย'))});
 todo().forEach(function(p){var r=stops[p.id];if(r&&r.s=='fail')L.push('- ส่งไม่ได้ '+p.n+': '+r.note)});return{t:L.join('\n'),c:c}}
function finish(){var s=sumo(),h='<h2>สรุปรอบส่ง</h2><textarea id="sm" rows="10" readonly>'+esc(rpt(true))+'</textarea><div class="er" id="er"></div><div class="row"><button class="gh" onclick="close_()">ปิดหน้าต่าง</button><button class="b0" onclick="cp()">คัดลอกส่งไลน์</button>';
 if(!dd.closedAt&&canW)h+='<button class="b1" onclick="closeDay()">ยืนยันปิดรอบ</button>';sheet(h+'</div><div class="row"><button class="gh" onclick="mailRpt()">📧 อีเมล</button><button class="gh" onclick="shareRpt()">📤 แชร์</button><button class="gh" onclick="csvDay()">⬇ CSV</button></div><div class="row"><button class="gh" onclick="gate(rptUI)">⚙ ตั้งค่ารายงาน</button></div>')}
async function closeDay(){var s=sumo(),c=s.c,t=hm();
 try{await db.doc('days/'+day).set(Object.assign({},dd,{d:day,closedAt:t,sum:{tot:todo().length,qty:c.dq,signed:c.signed,left:c.left,fail:c.fail,late:t>DL,pp:ppm(),pr:prm()}}));close_();sendHook();ask('ปิดรอบเรียบร้อยแล้ว กดตกลงเพื่อเปิดแอปอีเมลพร้อมรายงาน แล้วกดส่งในแอปอีเมลอีกครั้ง เพื่อให้หัวหน้าเห็นข้อมูล',function(){mailRpt()})}catch(x){$('#er').textContent='ปิดรอบไม่สำเร็จ ลองใหม่'}}
function cp(){var t=$('#sm');t.select();try{navigator.clipboard.writeText(t.value).then(function(){$('#er').style.color='var(--ok)';$('#er').textContent='คัดลอกแล้ว'},function(){document.execCommand('copy')})}catch(e){document.execCommand('copy')}}
function planUI(){if(!canW){tell('บัญชีนี้ดูได้อย่างเดียว');return}

function two(n){return('0'+n).slice(-2)}
function mkDay(d,open){var R=rnd(d),o={},sm={tot:pts.length,qty:0,signed:0,left:0,fail:0,pp:{},pr:{}},fi=Math.floor(R()*pts.length);
 pts.forEach(function(p,i){var b=SB[i%25]||3,r=R(),q=Math.max(1,Math.min(30,Math.round(b*(0.6+R()*0.9)))),st=i==fi?'fail':(r<0.1?'left':'signed'),t=two(8+Math.floor(i/3))+':'+two(Math.floor(R()*60)),rec={n:p.n,s:st,q:st=='fail'?0:q,t:t};
  if(st=='signed')rec.nm=SN[Math.floor(R()*SN.length)];if(st=='left')rec.note='ฝาก รปภ./วางหน้าห้อง';if(st=='fail')rec.note='ปิดทำการ';
  o['days/'+d+'/stops/'+p.id]=rec;sm[st]++;if(st!='fail'){sm.qty+=q;sm.pp[p.id]=q}if(st!='signed')sm.pr[p.id]=st=='left'?'L':'F'});
 if(open)o['days/'+d]={d:d};else{var cm=750+Math.floor(R()*190);sm.late=cm>900;o['days/'+d]={d:d,closedAt:two(Math.floor(cm/60))+':'+two(cm%60),sum:sm}}
 return o}
function sampleData(){if(!pts.length){tell('ยังไม่มีรายการจุด');return}
 ask('โหลดข้อมูลตัวอย่างในโหมดทดสอบ: วันที่เลือกอยู่จะมีครบ '+pts.length+' จุด (ยังไม่ปิดรอบ) และประวัติย้อนหลัง 10 วันส่ง ข้อมูลนี้ไม่ปนกับข้อมูลจริง ดำเนินการต่อ?',sampleRun)}
function sampleRun(){window.TEST=true;var o=mkDay(day,true),n=0,dt=new Date(day+'T00:00:00');
 while(n<10){dt.setDate(dt.getDate()-1);if(DAYS.indexOf(dt.getDay())>=0){Object.assign(o,mkDay(dt.toLocaleDateString('sv'),false));n++}}
 bulk(o);close_();tab='p';render()}
function h32(t){var h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return String(h)}
function isAdm(){return !sec.pin||Date.now()<admUntil}
function gate(fn){if(isAdm()){fn();return}sheet('<h2>🔒 รหัสผู้ดูแล</h2><label>ใส่รหัส PIN</label><input id="pn" type="password" inputmode="numeric" maxlength="8" style="text-align:center;font-size:24px"><div class="er" id="er"></div><div class="row"><button class="gh" onclick="close_()">ยกเลิก</button><button class="b0" id="pk">ตกลง</button></div>');$('#pk').onclick=function(){if(h32($('#pn').value.trim())==sec.pin){admUntil=Date.now()+600000;close_();render();fn()}else{$('#er').textContent='รหัสไม่ถูกต้อง'}}}
function pinUI(){sheet('<h2>🔒 ตั้งรหัสผู้ดูแล</h2><div class="warn">ตั้งรหัสตัวเลข 4–8 หลัก คนส่งน้ำจะแก้รายการจุด รูปจุด และการตั้งค่าไม่ได้ถ้าไม่มีรหัส เว้นว่างแล้วบันทึกเพื่อปิดรหัส</div><label>รหัสใหม่</label><input id="pn" type="password" inputmode="numeric" maxlength="8" style="text-align:center;font-size:24px"><div class="er" id="er"></div><div class="row"><button class="gh" onclick="close_()">ยกเลิก</button><button class="b0" onclick="savePin()">บันทึก</button></div>')}
async function savePin(){var v=$('#pn').value.trim();if(v&&!/^\d{4,8}$/.test(v)){$('#er').textContent='ต้องเป็นตัวเลข 4–8 หลัก';return}try{await db.doc('config/sec').set({pin:v?h32(v):''});admUntil=v?Date.now()+600000:0;close_();tell(v?'ตั้งรหัสผู้ดูแลแล้ว':'ปิดรหัสผู้ดูแลแล้ว')}catch(e){$('#er').textContent='บันทึกไม่สำเร็จ'}}
function routeUI(){var ids=rt.ids||[],h='<h2>ตั้งสายส่งของเครื่องนี้</h2><div class="warn">เลือกเฉพาะจุดที่คนส่งน้ำเครื่องนี้รับผิดชอบ ถ้าไม่เลือกเลยจะแสดงทุกจุด</div><label>ชื่อคนส่งน้ำ</label><input id="rn" value="'+esc(rt.name||'')+'"><label>รหัสสาย (อังกฤษหรือตัวเลข 1–3 ตัว เช่น A หรือ B)</label><input id="rc" maxlength="3" value="'+esc(rt.code||'')+'"><div class="row"><button class="gh" onclick="rsel(1)">เลือกทั้งหมด</button><button class="gh" onclick="rsel(0)">ล้าง</button></div><label>จุดที่รับผิดชอบ</label>';
 pts.forEach(function(p,i){h+='<label style="display:flex;align-items:center;gap:10px;color:var(--tx);margin:6px 0"><input type="checkbox" class="rp" data-id="'+p.id+'" style="width:26px;min-height:26px;flex:none" '+(ids.indexOf(p.id)>=0?'checked':'')+'>'+(i+1)+'. '+esc(p.n)+'</label>'});
 sheet(h+'<div class="er" id="er"></div><div class="row"><button class="gh" onclick="close_()">ยกเลิก</button><button class="b0" onclick="saveRoute()">บันทึก</button></div>')}
function rsel(v){document.querySelectorAll('.rp').forEach(function(c){c.checked=!!v})}
async function saveRoute(){var ids=[];document.querySelectorAll('.rp').forEach(function(c){if(c.checked)ids.push(c.dataset.id)});var code=$('#rc').value.trim().toUpperCase();if(code&&!/^[A-Z0-9]{1,3}$/.test(code)){$('#er').textContent='รหัสสายต้องเป็นอังกฤษหรือตัวเลข 1–3 ตัว';return}try{await db.doc('config/route').set({name:$('#rn').value.trim(),code:code,ids:ids});close_()}catch(e){$('#er').textContent='บันทึกไม่สำเร็จ'}}
start();
</script></body></html>
